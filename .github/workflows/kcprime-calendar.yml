name: KCPrime Calendar

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: kcprime-calendar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      warnings: ${{ steps.calendar.outputs.warnings }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r calendar-service/requirements.txt
      - id: calendar
        name: Build the calendar files from BLS and the Fed
        run: |
          python calendar-service/build_calendar.py --start-year 2025 --future-years 2 --output-dir public
          {
            echo "warnings<<WARNINGS_END"
            cat warnings.txt
            echo "WARNINGS_END"
          } >> "$GITHUB_OUTPUT"
      - name: Save newly verified dates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-service/verified
          if git diff --cached --quiet; then
            echo "Verified dates unchanged."
            exit 0
          fi
          git commit -m "Verified event dates updated from BLS and the Fed"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
      - name: Monthly heartbeat commit
        shell: bash
        run: |
          set -euo pipefail

          heartbeat_file="calendar-service/heartbeat.txt"
          current_month="$(date -u +'%Y-%m')"
          previous_month=""

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"

          if [ -f "$heartbeat_file" ]; then
            previous_month="$(grep '^HeartbeatMonth=' "$heartbeat_file" | cut -d= -f2 || true)"
          fi

          if [ "$previous_month" = "$current_month" ]; then
            echo "Heartbeat already committed for $current_month."
            exit 0
          fi

          mkdir -p "$(dirname "$heartbeat_file")"
          {
            echo "Purpose=Keeps the KCPrime Calendar scheduled workflow active."
            echo "HeartbeatMonth=$current_month"
            echo "LastRunUtc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Repository=$GITHUB_REPOSITORY"
            echo "RunId=$GITHUB_RUN_ID"
            echo "RunUrl=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$heartbeat_file"

          git add "$heartbeat_file"

          if git diff --cached --quiet; then
            echo "No heartbeat changes to commit."
            exit 0
          fi

          git commit -m "chore: monthly KCPrime calendar heartbeat"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
      - name: Home and not-found page
        shell: bash
        run: |
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Knyaw Capital</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#0D1B2E;font-family:Poppins,Arial,sans-serif}h1{margin:0;font-size:28px;letter-spacing:.04em;color:#FFFFFF;font-weight:800}h1 span{font-weight:300;color:#3DB27A}</style></head><body><h1>KNYAW <span>CAPITAL</span></h1></body></html>' > public/index.html
          cp public/index.html public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A run whose sources failed still publishes the last verified dates, then ends here as failed, so GitHub emails the owner.
  attention:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.warnings != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Calendar needs attention
        env:
          WARNINGS: ${{ needs.build.outputs.warnings }}
        run: |
          echo "$WARNINGS"
          exit 1
